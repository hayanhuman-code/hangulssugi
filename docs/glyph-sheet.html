<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>획 데이터 점검표</title>
<style>
  body { margin: 0; background: #f4f1ea; font-family: system-ui, sans-serif; color: #4a4a63; }
  h1 { font-size: 20px; padding: 16px 16px 0; margin: 0; }
  p.note { font-size: 13px; color: #7a7a9c; padding: 6px 16px 0; margin: 0; max-width: 70ch; line-height: 1.6; }
  h2 { font-size: 15px; color: #7a7a9c; padding: 18px 16px 0; margin: 0; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 14px; }
  .cell { width: 132px; background: white; border-radius: 14px; padding: 6px;
          text-align: center; font-size: 11px; color: #8a8aa8; }
  .cell b { display: block; font-size: 12px; color: #4a4a63; font-weight: 600; }
  .cell.over { background: #ffe2e2; outline: 2px solid #d34; }
</style>
</head>
<body>
<h1>획 데이터 점검표</h1>
<p class="note">
  hangul-data.js 와 alphabet-data.js 가 만드는 모든 글자를 획 순서대로(연한 색 → 진한 색)
  그려 본 것. 자모의 모양·조합 상자나 알파벳 기준선을 손볼 때 여기서 결과를 확인한다.
  알파벳은 네 줄 공책의 기준선을 함께 그린다. 잉크가 200 셀을 벗어난 글자는 셀을
  빨갛게 칠한다. 브라우저로 그냥 열면 된다.
</p>
<div id="out"></div>
<script src="../number-data.js"></script>
<script src="../hangul-data.js"></script>
<script src="../alphabet-data.js"></script>
<script>
(function () {
  const out = document.getElementById('out');
  const labels = { consonant: '자음', vowel: '모음', syllable: '글자', word: '단어' };
  const A_LABELS = { upper: '대문자', lower: '소문자' };

  // 잉크가 셀(0~200)을 벗어나면 눈으로 찾기 전에 표가 먼저 알려 준다.
  function inkBox(item) {
    const seg = window.PATH_UTIL.segments;
    const r = item.strokeWidth / 2;
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    const hit = (x, y) => {
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    };
    item.strokes.forEach(s => seg(s.d).forEach(g => {
      if (g[0] === 'L') { hit(g[1][0], g[1][1]); hit(g[2][0], g[2][1]); return; }
      for (let i = 0; i <= 24; i++) {
        const t = i / 24, u = 1 - t;
        const at = (a, b, c, d) => u*u*u*a + 3*u*u*t*b + 3*u*t*t*c + t*t*t*d;
        hit(at(g[1][0], g[2][0], g[3][0], g[4][0]), at(g[1][1], g[2][1], g[3][1], g[4][1]));
      }
    }));
    return [x0 - r, y0 - r, x1 + r, y1 + r];
  }

  function draw(item, lines) {
    const n = item.strokes.length;
    const guide = (lines || []).map(y =>
      `<line x1="0" y1="${y}" x2="200" y2="${y}" stroke="#c9c4dd" stroke-width="1.5" stroke-dasharray="6 6"/>`
    ).join('');
    const paths = item.strokes.map((s, i) =>
      `<path d="${s.d}" stroke="${item.color}" stroke-opacity="${(0.35 + 0.65 * (i + 1) / n).toFixed(2)}"` +
      ` stroke-width="${item.strokeWidth}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
    ).join('');
    // 단어·두 자리 숫자는 셀보다 넓은 viewBox 를 쓴다 — 200 으로 못박지 않는다.
    const vb = (item.viewBox || '0 0 200 200').split(/\s+/).map(Number);
    const box = inkBox(item);
    const over = box[0] < vb[0] - 0.6 || box[1] < vb[1] - 0.6
              || box[2] > vb[0] + vb[2] + 0.6 || box[3] > vb[1] + vb[3] + 0.6;
    const cell = document.createElement('div');
    cell.className = 'cell' + (over ? ' over' : '');
    cell.innerHTML = `<svg width="120" height="120" viewBox="${item.viewBox}" preserveAspectRatio="xMidYMid meet">${guide}${paths}</svg>` +
      `<b>${item.id}</b>${n}획${item.parts ? ' · ' + item.parts.length + '조각' : ''}`;
    return cell;
  }

  function section(title, ids, lookup, lines) {
    if (!ids || !ids.length) return;
    const h = document.createElement('h2');
    h.textContent = `${title} — ${ids.length}개`;
    out.appendChild(h);
    const row = document.createElement('div');
    row.className = 'row';
    ids.forEach(id => row.appendChild(draw(lookup[id], lines)));
    out.appendChild(row);
  }

  Object.keys(labels).forEach(category => {
    section(labels[category], window.HANGUL_ORDER[category], window.HANGUL_DATA);
  });

  // 알파벳 — 네 줄 공책의 기준선을 함께 그려야 어긋난 글자가 보인다.
  const L = window.ALPHABET_LINES || {};
  Object.keys(A_LABELS).forEach(category => {
    const lines = category === 'upper'
      ? [L.upper.cap, L.upper.mid, L.upper.base]
      : [L.lower.asc, L.lower.x, L.lower.base, L.lower.desc];
    section(A_LABELS[category], window.ALPHABET_ORDER[category], window.ALPHABET_DATA, lines);
  });

  // 숫자도 같은 셀을 쓴다 — 알파벳 대문자와 줄이 맞는지 나란히 본다.
  const nums = [];
  for (let n = 0; n <= 20; n++) nums.push(String(n));
  section('숫자', nums, window.NUMBER_DATA, [L.upper.cap, L.upper.base]);
})();
</script>
</body>
</html>
