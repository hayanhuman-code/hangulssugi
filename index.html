<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한글·숫자 쓰기 연습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* ---------- 디자인 토큰 (docs/화면시안-v2.dc.html) ----------
     바탕은 크림 단색이다. v1 의 무지개 그라데이션은 흰 카드의 경계를 지우고,
     같은 카드를 위치에 따라 분홍빛·푸른빛으로 보이게 만들었다. */
  :root {
    --bg: #FFF8EE;
    --card: #FFFFFF;
    --canvas: #FFFDF8;
    --sunken: #F6EEE1;

    --ink: #3B3226;
    --ink-mid: #7A6C5A;
    --ink-weak: #A79A88;

    --lock-face: #F1E9DC;
    --lock-edge: #E7DDCC;
    --lock-line: #B6A994;

    --step-now: #3F9E6C;
    --step-done: #8FD8B0;
    --star: #F5B324;
    --sound: #FFC94D;

    /* 그림자는 따뜻한 갈색이다. 크림 바탕 위의 검정 그림자는 때가 탄 것처럼 보인다. */
    --sh-card: 0 6px 0 rgba(90,74,56,.12), 0 12px 24px rgba(90,74,56,.08);
    --sh-press: 0 2px 0 rgba(90,74,56,.12), 0 4px 10px rgba(90,74,56,.08);
    --sh-over: 0 10px 0 rgba(90,74,56,.14), 0 32px 64px rgba(60,48,36,.22);

    --r-ico: 24px;
    --r-btn: 28px;
    --r-card: 32px;
    --r-big: 40px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0;
    /* 아이가 처음 배우는 글자라 손글씨풍이 아닌 기본 서체(고딕)로 보여 준다 */
    font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    font-weight: 700;
    overflow: hidden;
    /* 모바일 브라우저의 100vh 는 주소창·툴바가 숨겨진 상태의 높이다. 실제로 보이는
       영역은 그보다 작아서, 화면 아래쪽(버튼 바)이 툴바에 가려진다. 스크롤도 막아 두었으니
       아이는 '다 했어요' 를 누를 방법이 없다. dvh 는 지금 실제로 보이는 높이다. */
    height: 100vh; height: 100dvh; width: 100vw;
    touch-action: none;
    -webkit-user-select: none;
    background: var(--bg);
    color: var(--ink);
  }
  .app { width: 100vw; height: 100vh; height: 100dvh; position: relative; overflow: hidden; }
  .ico-svg { display: block; flex: 0 0 auto; }

  /* ---------- 홈 화면 ---------- */
  .home {
    height: 100%; display: none; flex-direction: column; padding: 36px;
    background: var(--bg);
  }
  .home.active { display: flex; }
  .home-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .home-title {
    font-size: 34px; font-weight: 800; color: var(--ink);
    margin: 0; letter-spacing: -0.5px;
  }
  .stars-collected {
    background: var(--star); color: #FFFFFF;
    padding: 0 24px; height: 64px; border-radius: 999px;
    font-size: 30px; font-weight: 800;
    box-shadow: 0 6px 0 rgba(90,74,56,.14);
    display: flex; align-items: center; gap: 8px;
  }
  .stars-collected .ico-svg { color: #FFFFFF; }

  /* ---------- 카테고리 탭 ---------- */
  .category-tabs { display: flex; gap: 12px; margin-bottom: 20px; }
  .category-tab {
    flex: 1; min-width: 0; height: 72px; border: none; border-radius: 999px; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 30px;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    box-shadow: 0 5px 0 rgba(90,74,56,.10);
    /* '숫자'가 '숫/자'로 접히면 탭이 두 줄이 된다. 폭이 모자라면 접는 게 아니라
       글자를 줄여야 한다 — 줄이는 값은 아래 화면별 분기에 있다. */
    white-space: nowrap;
  }
  .category-tab .tab-icon {
    min-width: 44px; height: 44px; padding: 0 8px; border-radius: 16px; background: #fff;
    font-size: 22px; display: flex; align-items: center; justify-content: center;
    white-space: nowrap; flex: 0 0 auto;
  }
  .category-tab.on { box-shadow: 0 6px 0 rgba(90,74,56,.18); }
  .category-tab:focus-visible { outline: 4px solid var(--step-now); outline-offset: 3px; }

  /* ---------- 카드 그리드 (가로 페이지 넘김) ----------
     만 4세는 세로 스크롤을 잘 하지 못한다. 항목이 한 화면을 넘으면
     스크롤 대신 페이지를 넘기고, 아래에 점으로 몇 장인지 알려 준다. */
  .grid-viewport { flex: 1; min-height: 0; overflow: hidden; position: relative; }
  .grid-track {
    display: flex; height: 100%;
    transition: transform 260ms cubic-bezier(.22,.61,.36,1);
  }
  .grid-track.dragging { transition: none; }
  /* 열은 minmax(0,1fr) 이라야 한다. 1fr 의 기본 최소값은 min-content 여서
     카드 안 글자가 열을 밀어내면 그리드가 화면 밖으로 삐져나간다(폰에서 실제로 그랬다). */
  .grid-page {
    flex: 0 0 100%; height: 100%; min-width: 0;
    display: grid; gap: 20px; align-content: center;
  }
  .grid-page.cols-7 { grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: 150px; }
  .grid-page.cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: 150px; }
  .grid-page.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 112px; }
  .grid-page.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-rows: 132px; }
  .grid-page.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: 104px; }
  .grid-dots {
    display: flex; gap: 12px; justify-content: center; align-items: center;
    height: 36px; margin-top: 4px;
  }
  .grid-dots.hidden { display: none; }
  .grid-dot {
    width: 16px; height: 16px; border-radius: 999px; border: none; padding: 0;
    background: var(--lock-edge); cursor: pointer;
  }
  .grid-dot.on { background: var(--ink-weak); width: 40px; }
  .grid-dot:focus-visible { outline: 3px solid var(--step-now); outline-offset: 3px; }

  .number-card {
    background: var(--card); border-radius: var(--r-card); padding: 12px;
    font-family: inherit; color: inherit; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    box-shadow: var(--sh-card);
    transition: transform 90ms ease-out, box-shadow 90ms ease-out;
    border: 3px solid transparent;
  }
  .number-card:active { transform: translateY(4px); box-shadow: var(--sh-press); }
  .number-card:focus-visible { outline: 4px solid var(--step-now); outline-offset: 3px; }
  .number-card .num { font-size: 44px; font-weight: 800; line-height: 1; margin-bottom: 2px; }
  .number-card .ko { font-size: 18px; color: var(--ink-mid); font-weight: 700; }
  .number-card .card-stars {
    position: absolute; top: 10px; right: 12px;
    display: flex; gap: 3px;
  }
  .number-card .card-stars .ico-svg { color: var(--star); }
  .number-card .card-stars .ico-svg.empty { color: var(--lock-edge); }

  /* 단어는 항목이 길어 카드를 넓게 눕힌다 */
  .grid-page.cols-4 .number-card { flex-direction: row; gap: 16px; justify-content: flex-start; padding: 0 20px; }
  /* 두 칸 그리드는 카드가 넓다 — 폰이든 태블릿 세로든 가로 배치가 맞다 */
  .grid-page.cols-2 .number-card { flex-direction: row; gap: 12px; justify-content: flex-start; padding: 0 14px; }
  .number-card .word-emoji {
    width: 64px; height: 64px; border-radius: 20px; font-size: 34px;
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .grid-page.cols-4 .number-card .num.word-text { font-size: 38px; margin: 0; }

  /* 잠금 — 평평하게 가라앉히고 빨강·회색 경고 톤은 쓰지 않는다 */
  .number-card.locked {
    background: var(--lock-face); border-color: var(--lock-edge);
    box-shadow: none; cursor: default;
  }
  .number-card.locked .num, .number-card.locked .word-emoji { opacity: 0.35; }
  .number-card.locked .ko { color: var(--lock-line); }
  .number-card.locked:active { transform: none; box-shadow: none; }
  .number-card .card-lock { position: absolute; bottom: 10px; right: 12px; color: var(--lock-line); }
  @keyframes card-bounce {
    0%   { transform: translateY(0) scale(1); }
    35%  { transform: translateY(-8px) scale(1.03); }
    70%  { transform: translateY(0) scale(0.99); }
    100% { transform: translateY(0) scale(1); }
  }
  .number-card.bounce { animation: card-bounce 420ms ease-out; }

  /* ---------- 단어 넣기 (부모용) ---------- */
  .number-card.add-word { background: var(--sunken); border: 3px dashed var(--lock-line); box-shadow: none; }
  .number-card .add-word-label { font-size: 18px; color: var(--ink-mid); }
  .word-sheet {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; background: rgba(60,48,36,0.42);
  }
  .word-sheet.active { display: flex; }
  .sheet-card {
    width: min(560px, 92vw); max-height: 88vh; overflow: auto;
    background: var(--card); border-radius: var(--r-card); padding: 24px;
    box-shadow: var(--sh-over);
    display: flex; flex-direction: column; gap: 12px;
  }
  .sheet-card h2 { margin: 0; font-size: 26px; }
  .sheet-hint { margin: 0; font-size: 16px; font-weight: 500; color: var(--ink-mid); line-height: 1.6; }
  .sheet-row { display: flex; gap: 10px; }
  .sheet-row input {
    flex: 1; height: 52px; border-radius: 16px; border: 3px solid var(--lock-edge);
    padding: 0 16px; font-family: inherit; font-size: 22px; color: inherit; background: var(--canvas);
  }
  .sheet-row input:focus-visible { outline: 4px solid var(--step-now); outline-offset: 2px; }
  .sheet-emojis { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet-emoji {
    width: 46px; height: 46px; border-radius: 14px; font-size: 22px; cursor: pointer;
    border: 3px solid transparent; background: var(--sunken);
  }
  .sheet-emoji.on { border-color: var(--step-now); background: #E3F2E9; }
  .sheet-msg { min-height: 20px; font-size: 16px; font-weight: 500; color: #B8481F; }
  .sheet-list { display: flex; flex-direction: column; gap: 6px; }
  .sheet-item {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--sunken); border-radius: 14px; padding: 8px 14px; font-size: 20px;
  }
  .sheet-del {
    border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 16px; font-weight: 700; color: var(--ink-mid);
  }
  .sheet-empty { font-size: 16px; font-weight: 500; color: var(--ink-weak); padding: 4px 2px; }

  /* ---------- 연습 화면 ---------- */
  .practice {
    height: 100%; display: none; flex-direction: column; padding: 36px;
  }
  .practice.active { display: flex; }
  .practice-header {
    display: flex; align-items: center; gap: 12px; height: 88px; margin-bottom: 24px;
  }
  .btn-back {
    width: 88px; height: 88px; flex: 0 0 auto;
    background: var(--card); border: none; border-radius: 999px;
    cursor: pointer; color: var(--ink-mid);
    box-shadow: var(--sh-card);
    display: flex; align-items: center; justify-content: center;
  }
  .btn-back:active { transform: translateY(4px); box-shadow: var(--sh-press); }
  .header-spacer { width: 88px; flex: 0 0 auto; }

  /* 단계 칩은 표시일 뿐 누를 수 없다. CTA 와 같은 옷을 입히지 않는다. */
  .step-indicator { display: flex; gap: 12px; flex: 1; justify-content: center; }
  .step-dot {
    background: var(--lock-face); border-radius: 999px;
    height: 72px; padding: 0 24px; font-size: 26px; font-weight: 700;
    color: var(--ink-weak); display: flex; align-items: center; gap: 12px;
    white-space: nowrap;
  }
  .step-dot.active { background: var(--step-now); color: #fff; box-shadow: 0 6px 0 rgba(45,110,76,.55); }
  .step-dot.done { background: var(--step-done); color: #26543C; }
  .step-dot .step-num {
    background: rgba(255,255,255,0.45); border-radius: 999px;
    width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 22px; color: inherit;
  }
  .step-dot.active .step-num { background: rgba(255,255,255,0.30); }
  .step-dot .step-num .ico-svg { color: inherit; }

  /* 좌 332 / 우 나머지 — 시안의 332 : 748 */
  .practice-body {
    flex: 1; display: grid; grid-template-columns: 332px 1fr; gap: 20px;
    min-height: 0;
  }

  /* 왼쪽: 정보 패널 — 큰 카드 한 장이 아니라 내용에 맞춰 붙는 카드 2장 */
  .info-panel { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
  .info-card {
    background: var(--card); border-radius: var(--r-card); padding: 20px;
    box-shadow: var(--sh-card);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    flex: 0 0 auto;
  }
  /* 눌러서 소리로 들을 수 있는 요소 */
  .speakable {
    border: none; background: transparent; font-family: inherit; color: inherit;
    cursor: pointer; padding: 2px 10px; border-radius: 16px;
    position: relative; transition: background 90ms ease-out, transform 90ms ease-out;
  }
  .speakable:active { transform: scale(0.96); background: var(--sunken); }
  .speakable:focus-visible { outline: 4px solid var(--step-now); outline-offset: 2px; }
  .speakable.speaking { background: #FFF0C9; }
  .info-num {
    font-size: 96px; font-weight: 800; line-height: 1;
    margin: 0;
  }
  /* '강아지' 같은 여러 글자는 한 칸에 다 들어가지 않는다 */
  .info-num.compact { font-size: 60px; line-height: 1.1; }
  .info-names { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
  .info-ko { font-size: 24px; color: var(--ink-mid); }
  .info-native { font-size: 24px; color: var(--ink-mid); }
  .info-native::before { content: '·'; margin-right: 10px; color: var(--lock-line); }
  .info-en { font-size: 18px; color: var(--ink-weak); letter-spacing: 1px; text-transform: uppercase; }

  /* .info-card 는 세로 배치라, 세는 물건은 다시 가로로 눕혀 줄바꿈시킨다 */
  .info-objects {
    display: flex; flex-direction: row; flex-wrap: wrap;
    align-items: center; justify-content: center;
    align-content: center; gap: 6px; overflow: hidden;
  }
  .info-objects .emoji {
    font-size: 34px;
    animation: bounce-in 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) both;
  }
  .info-objects .obj-caption {
    width: 100%; text-align: center; margin-top: 8px;
    font-size: 24px; color: var(--ink-mid);
  }
  .info-objects.zero { color: var(--ink-weak); font-size: 20px; }
  @keyframes bounce-in {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* 소리 듣기는 전 화면 같은 자리 — 정보 패널 좌측 하단 */
  .sound-btn {
    width: 132px; height: 132px; border-radius: 999px; border: none;
    margin-top: auto; flex: 0 0 auto; cursor: pointer;
    background: var(--sound); color: var(--ink);
    box-shadow: 0 6px 0 rgba(90,74,56,.18);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    font-family: inherit; font-weight: 700; font-size: 18px;
  }
  .sound-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(90,74,56,.18); }
  .sound-btn:focus-visible { outline: 4px solid var(--step-now); outline-offset: 3px; }

  /* 오른쪽: 그리기 영역 */
  .canvas-panel { display: flex; flex-direction: column; min-height: 0; }
  .canvas-title {
    height: 44px; flex: 0 0 auto;
    font-size: 24px; color: var(--ink-mid);
    display: flex; align-items: center; justify-content: center;
  }
  .canvas-wrapper {
    flex: 1; position: relative;
    background: var(--canvas);
    border-radius: var(--r-big);
    box-shadow: var(--sh-card);
    overflow: hidden;
    min-height: 0;
  }
  /* 자식 선택자여야 한다. 후손까지 잡으면 캔버스 위에 얹는 도장·아이콘 SVG 까지
     캔버스 전체 크기로 늘여 버린다. */
  .canvas-wrapper > svg, .canvas-wrapper > canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }
  .canvas-wrapper > canvas { touch-action: none; z-index: 2; }
  .guide-svg { z-index: 1; transition: opacity 0.25s ease; }
  /* 데모는 가이드를 파괴하지 않고 별도 오버레이 레이어에서 재생한다 */
  .demo-svg { z-index: 3; pointer-events: none; }
  .guide-svg.dimmed { opacity: 0.18; }

  /* 가이드 스타일 — 따라쓰기 가이드는 세 겹으로 분리한다.
     ① 넓고 연한 띠(어디를 지날지)  ② 그 위 가는 점선(중심선)  ③ 시작 배지와 끝 화살표.
     배지와 화살표는 띠 안이 아니라 획의 시작점·끝점 바깥에 놓는다. 획 위에 얹으면
     아이가 이제부터 그으려는 바로 그 부분을 가린다. */
  .stroke-outline { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .guide-band { opacity: 0.16; }
  .guide-dots {
    stroke-linecap: butt;
    opacity: 0.70;   /* dasharray 는 JS 에서 설정 */
  }
  /* 따라쓰기는 한 획씩 차례로 받는다 — 다 쓴 획은 옅게 남겨 지금까지 만든
     모양을 보여 주고, 아직 차례가 아닌 획은 글자 윤곽만 짐작될 만큼 흐리게 둔다. */
  .stroke-done { opacity: 0.4; stroke-linecap: round; stroke-linejoin: round; }
  /* 혼자쓰기에서 순서가 어긋난 순간 잠깐 비추는 획 */
  .hint-flash { animation: hint-in 1.7s ease-in-out both; }
  @keyframes hint-in {
    0% { opacity: 0; } 12% { opacity: 0.55; }
    75% { opacity: 0.55; } 100% { opacity: 0; }
  }
  .stroke-later { opacity: 0.07; stroke-linecap: round; stroke-linejoin: round; }
  /* 제목 옆 '2/3획' 표시 */
  .stroke-count {
    font-size: 0.85em; font-weight: 700; color: var(--ink-weak);
    background: var(--lock-face); border-radius: 999px; padding: 2px 10px; margin-left: 6px;
  }
  .start-badge { animation: pulse-badge 1.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes pulse-badge {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  .stroke-animate {
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: draw-stroke var(--dur, 1.6s) ease-in-out forwards;
    animation-delay: var(--delay, 0s);
  }
  @keyframes draw-stroke { to { stroke-dashoffset: 0; } }

  /* 하단 버튼 바 — 세 단계 모두 자리가 같다. 없는 버튼은 자리를 비워 두고
     뒤 버튼이 당겨오지 않는다. */
  .action-bar {
    height: 112px; flex: 0 0 auto; margin-top: 20px;
    display: flex; gap: 16px; align-items: center;
  }
  .btn {
    background: var(--card); border: none; border-radius: var(--r-btn);
    cursor: pointer; font-family: inherit; font-weight: 700; color: var(--ink-mid);
    box-shadow: var(--sh-card);
    /* 기본값은 부모 화면(단어 넣기)의 보통 버튼 기준. 아이 화면 버튼은 아래에서 키운다. */
    min-height: 60px; padding: 0 24px; font-size: 22px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform 90ms ease-out, box-shadow 90ms ease-out;
  }
  /* 부모용 시트의 주요 버튼 */
  .btn-primary { background: var(--step-now); color: #fff; box-shadow: 0 4px 0 rgba(45,110,76,.55); }
  .btn-primary:active { box-shadow: 0 1px 0 rgba(45,110,76,.55); }
  .btn:active { transform: translateY(4px); box-shadow: var(--sh-press); }
  .btn:focus-visible { outline: 4px solid var(--step-now); outline-offset: 3px; }
  .btn[disabled] { opacity: 0.45; }
  /* 아이콘 버튼 112 × 112 — 만 4세 손가락 기준 */
  .btn-icon {
    flex-direction: column; gap: 4px;
    width: 112px; height: 112px; padding: 0;
    border-radius: var(--r-ico);
    font-size: 18px;
  }
  .btn-slot { width: 112px; height: 112px; flex: 0 0 auto; }
  .action-spacer { flex: 1; }
  .btn-cta {
    height: 88px; padding: 0 44px; font-size: 32px;
    background: var(--step-now); color: #fff;
    box-shadow: 0 6px 0 rgba(45,110,76,.55);
  }
  .btn-cta:active { box-shadow: 0 2px 0 rgba(45,110,76,.55); }

  /* ---------- 완료 도장 ----------
     화면을 덮는 모달 대신 종이 위에 도장을 찍는다. 아이가 방금 쓴 글자가
     그대로 보이고, 버튼을 고를 필요도 없다. */
  .stamp {
    position: absolute; right: 28px; bottom: 24px; z-index: 6;
    display: none; pointer-events: none;
    width: 200px; height: 200px;
    color: var(--step-now);
  }
  .stamp.active {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    animation: stamp-in 420ms cubic-bezier(0.34, 1.3, 0.64, 1) both;
  }
  .stamp .stamp-ring { position: absolute; inset: 0; }
  .stamp .stamp-label {
    font-size: 28px; font-weight: 800; color: inherit;
    text-align: center; line-height: 1.15;
  }
  @keyframes stamp-in {
    0% { transform: scale(2.4) rotate(-24deg); opacity: 0; }
    60% { transform: scale(0.94) rotate(-12deg); opacity: 1; }
    100% { transform: scale(1) rotate(-12deg); opacity: 1; }
  }
  .stamp-stars { display: flex; gap: 6px; }
  .stamp-stars .ico-svg { color: var(--star); }

  /* 떠다니는 축하 이모지 */
  .confetti {
    position: absolute; font-size: 32px; pointer-events: none;
    animation: confetti-fall 2s ease-out forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(120vh) rotate(720deg); opacity: 0; }
  }

  /* 격려 뱃지 (그리는 도중 표시) */
  .encourage-badge {
    position: absolute; top: 16px; right: 16px;
    background: var(--step-done); color: #26543C;
    padding: 10px 20px; border-radius: 999px;
    font-size: 22px; font-weight: 700;
    box-shadow: 0 4px 0 rgba(90,74,56,.14);
    z-index: 4;
    animation: badge-in 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55) both;
  }
  @keyframes badge-in {
    0% { transform: translateX(80px); opacity: 0; }
    100% { transform: translateX(0); opacity: 1; }
  }

  /* 움직임 줄이기 설정 존중.
     획순 데모(획이 그려지는 애니메이션)는 학습의 핵심이라 유지하고,
     장식용 반복 애니메이션과 컨페티만 끈다. */
  @media (prefers-reduced-motion: reduce) {
    .start-badge { animation: none !important; }
    /* 힌트 획은 깜빡이지 않고 그냥 떠 있다가 스크립트가 걷어 간다 */
    .hint-flash { animation: none !important; opacity: 0.55; }
    .info-objects .emoji, .encourage-badge, .stamp.active {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
    .confetti { display: none; }
    .number-card, .btn, .speakable, .grid-track { transition: none; }
  }

  /* 반응형: 폰 — 가로폭이 좁을 때.
     여기서 줄이는 값은 app.js 의 PAGE_SHAPE_NARROW 와 짝이다(같은 560px 기준).
     열 수만 줄이고 쪽당 개수를 그대로 두면 아래 줄이 화면 밖으로 밀린다. */
  @media (max-width: 560px) {
    .home { padding: 16px 14px 10px; }
    .home-header { margin-bottom: 12px; }
    .home-title { font-size: 22px; letter-spacing: -0.6px; }
    .stars-collected { height: 44px; padding: 0 14px; font-size: 20px; gap: 5px; }

    .category-tabs { gap: 6px; margin-bottom: 12px; }
    .category-tab {
      height: 52px; font-size: 16px; gap: 5px; padding: 0 4px;
      white-space: nowrap; min-width: 0;
    }
    .category-tab .tab-icon {
      min-width: 28px; height: 28px; padding: 0 4px; font-size: 14px; border-radius: 10px;
    }

    .grid-page { gap: 10px; }
    .grid-dots { height: 26px; margin-top: 0; }
    /* cols-4 의 가로 배치는 넓은 화면의 '단어' 카드용이다.
       폰에서는 숫자·자음도 cols-4 를 쓰므로 세로 배치로 되돌린다. */
    .grid-page.cols-4 .number-card { flex-direction: column; gap: 0; justify-content: center; padding: 8px; }
    .number-card .num { font-size: 30px; }
    .number-card .ko { font-size: 13px; }
    .number-card .card-stars { top: 5px; right: 6px; gap: 1px; }
    .number-card .card-lock { bottom: 5px; right: 6px; }
    .number-card .word-emoji { font-size: 26px; }
    }

  /* 연습 화면은 폭뿐 아니라 '높이'가 모자랄 때도 줄여야 한다.
     폰을 가로로 들면 844x390 처럼 폭은 넓고 높이만 낮아, 폭 기준만으로는
     원래 크기가 그대로 적용돼 버튼과 머리말이 화면 아래로 밀린다. */
  @media (max-width: 560px), (max-height: 560px) {
    /* 연습 화면 — 좁은 폭에 맞춰 머리말과 버튼을 줄인다 */
    .practice { padding: 10px 12px; }
    .practice-header { height: 56px; margin-bottom: 10px; gap: 6px; }
    .btn-back { width: 56px; height: 56px; }
    .header-spacer { display: none; }
    .step-indicator { gap: 5px; min-width: 0; }
    .step-dot { height: 44px; padding: 0 7px; font-size: 13px; gap: 4px; min-width: 0; overflow: hidden; }
    .step-dot .step-num { width: 24px; height: 24px; font-size: 13px; }
    .step-dot .ico-svg { width: 16px; height: 16px; }

    .practice-body { gap: 8px; }
    .info-panel { gap: 8px; min-width: 0; }
    .info-card { padding: 8px; min-width: 0; flex: 1 1 0; }
    .info-num { font-size: 34px; }
    /* 폰에서는 정보 패널이 화면의 3분의 1을 먹었다. 아이가 쓰는 곳은 캔버스다 —
       뜻 그림과 설명을 줄여 그 높이를 캔버스에 돌려준다. */
    .info-ko, .info-native { font-size: 16px; }
    .info-en { font-size: 11px; }
    .info-objects .emoji { font-size: 22px; }
    .info-objects .obj-caption { font-size: 14px; margin-top: 4px; }
    .info-objects.zero { font-size: 13px; }
    .sound-btn { width: 56px; height: 56px; flex: 0 0 auto; font-size: 10px; gap: 0; }
    .sound-btn .ico-svg { width: 22px; height: 22px; }

    .action-bar { height: 64px; margin-top: 8px; gap: 6px; }
    .action-bar .btn { min-width: 0; }
    .btn-slot { width: 0; flex: 0 0 auto; }
    .btn-icon { width: 56px; height: 56px; font-size: 10px; gap: 1px; }
    .btn-icon .ico-svg { width: 22px; height: 22px; }
    .btn-cta { height: 56px; font-size: 18px; padding: 0 14px; min-width: 0; }
  }

  /* 아이폰 SE 같은 375px 폭에는 단계 칩 3개의 라벨이 다 들어가지 않는다.
     지금 단계의 라벨만 남기고 나머지는 번호와 완료 표시로만 보여 준다 —
     어느 단계에 있는지는 그대로 읽히고 폭은 넉넉해진다. */
  @media (max-width: 400px) {
    .step-dot { font-size: 12px; padding: 0 8px; gap: 4px; }
    .step-dot .step-num { width: 21px; height: 21px; font-size: 12px; }
    .step-dot:not(.active) > span:not(.step-num) { display: none; }
  }

  /* 반응형: 세로로 세운 화면 (태블릿 세로 포함).
     본문을 한 줄로 세우는 것만으로는 모자란다. 폭이 절반으로 줄었는데 머리말·버튼·
     정보 패널이 가로 기준 크기 그대로면 오른쪽으로 밀려 잘린다 — 600px 폭에서
     단계 칩과 CTA 가 화면 밖으로 나갔고 소리 듣기 버튼은 아예 밀려 사라졌다.
     열 수는 여기서 정하지 않는다. app.js 의 PAGE_SHAPE_PORTRAIT 가 정한다. */
  /* 여기에는 '배치'만 둔다. 크기를 줄이는 선언은 아래 태블릿 전용 블록으로 간다 —
     이 블록은 폰 분기보다 뒤에 있어서, 여기에 크기를 적으면 폰에서도 그 값이 이긴다.
     실제로 폰의 큰 글자(34px)가 60px 로, 소리 버튼(56px)이 112px 로 되살아나
     캔버스를 129px 까지 밀어냈다. */
  @media (max-aspect-ratio: 1/1) {
    .practice-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    /* 정보 패널이 가로로 눕으면 카드는 남는 폭을 나눠 가져야 한다.
       내용 폭 그대로 두면 긴 설명 한 줄이 소리 듣기 버튼을 화면 밖으로 밀어낸다. */
    .info-panel { flex-direction: row; align-items: stretch; min-width: 0; }
    .info-card { flex: 1 1 0; min-width: 0; }
    .sound-btn { margin-top: 0; margin-left: 0; }
  }

  /* 태블릿 세로 (폰보다는 넓다). 폰 분기(560px 이하)가 잡아 주지 못하는 구간이다. */
  @media (max-aspect-ratio: 1/1) and (min-width: 561px) {
    .info-card { padding: 14px; }
    .info-num { font-size: 52px; }
    .info-ko, .info-native, .info-objects .obj-caption { font-size: 20px; }
    .sound-btn { width: 96px; height: 96px; font-size: 15px; }
    .sound-btn .ico-svg { width: 38px; height: 38px; }

    .home { padding: 24px 20px 12px; }
    .home-title { font-size: 28px; }
    .category-tabs { gap: 8px; }
    .category-tab { height: 62px; font-size: 20px; gap: 7px; padding: 0 6px; }
    .category-tab .tab-icon { min-width: 34px; height: 34px; padding: 0 6px; font-size: 15px; border-radius: 12px; }
    .grid-page { gap: 14px; }

    .practice { padding: 20px; }
    .practice-header { height: 72px; margin-bottom: 16px; }
    .btn-back { width: 72px; height: 72px; }
    .header-spacer { display: none; }
    .step-indicator { gap: 8px; min-width: 0; }
    .step-dot { height: 60px; padding: 0 12px; font-size: 18px; gap: 7px; min-width: 0; overflow: hidden; }
    .step-dot .step-num { width: 30px; height: 30px; font-size: 16px; }

    .action-bar { height: 92px; margin-top: 14px; gap: 10px; }
    .btn-icon, .btn-slot { width: 88px; height: 88px; }
    .btn-icon { font-size: 15px; }
    .btn-icon .ico-svg { width: 36px; height: 36px; }
    .btn-cta { height: 76px; font-size: 24px; padding: 0 24px; min-width: 0; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 홈 화면 -->
  <div class="home active" id="home">
    <div class="home-header">
      <h1 class="home-title">오늘은 뭐 써 볼까?</h1>
      <div class="stars-collected" id="totalStars" aria-label="모은 별">
        <span id="totalStarsIcon"></span><span id="totalStarsNum">0</span>
      </div>
    </div>
    <div class="category-tabs" id="categoryTabs" role="group" aria-label="배울 것 고르기"></div>
    <div class="grid-viewport" id="gridViewport">
      <div class="grid-track" id="numberGrid" role="list" aria-label="연습할 것 고르기"></div>
    </div>
    <div class="grid-dots" id="gridDots" role="tablist" aria-label="쪽 넘기기"></div>
  </div>

  <!-- 단어 넣기 (부모용) -->
  <div class="word-sheet" id="wordSheet"></div>

  <!-- 연습 화면 -->
  <div class="practice" id="practice">
    <div class="practice-header">
      <button type="button" class="btn-back" onclick="goHome()" aria-label="처음 화면으로 돌아가기"></button>
      <div class="step-indicator" id="stepIndicator" aria-hidden="true">
        <div class="step-dot" data-step="0"><span class="step-num">1</span><span>보기</span></div>
        <div class="step-dot" data-step="1"><span class="step-num">2</span><span>따라쓰기</span></div>
        <div class="step-dot" data-step="2"><span class="step-num">3</span><span>혼자쓰기</span></div>
      </div>
      <div class="header-spacer"></div>
    </div>

    <div class="practice-body">
      <div class="info-panel" id="infoPanel">
        <div class="info-card">
          <button type="button" class="info-num speakable" id="infoNum">0</button>
          <div class="info-names">
            <button type="button" class="info-ko speakable" id="infoKo">영</button>
            <button type="button" class="info-native speakable" id="infoNative">하나</button>
          </div>
          <div class="info-en" id="infoEn">zero</div>
        </div>
        <div class="info-card info-objects" id="infoObjects"></div>
        <button type="button" class="sound-btn" id="soundBtn" aria-label="이름 들려주기"></button>
      </div>

      <div class="canvas-panel">
        <div class="canvas-title" id="canvasTitle">글자 모양을 잘 보세요</div>
        <div class="canvas-wrapper" id="canvasWrapper">
          <svg class="guide-svg" id="guideSvg" preserveAspectRatio="xMidYMid meet"></svg>
          <canvas id="drawCanvas"></canvas>
          <svg class="demo-svg" id="demoSvg" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
          <div class="stamp" id="stamp" aria-hidden="true"></div>
        </div>
        <div class="action-bar" id="actionBar"></div>
      </div>
    </div>
  </div>
</div>

<script src="number-data.js"></script>
<script src="hangul-data.js"></script>
<script src="custom-words.js"></script>
<script src="app.js"></script>
</body>
</html>
