<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>한글·숫자 쓰기 연습 🎈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0;
    /* 아이가 처음 배우는 글자라 손글씨풍이 아닌 기본 서체(고딕)로 보여 준다 */
    font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    font-weight: 700;
    overflow: hidden;
    height: 100vh; width: 100vw;
    touch-action: none;
    -webkit-user-select: none;
    background: linear-gradient(135deg, #FFF9DC 0%, #FFE5F1 50%, #E0F4FF 100%);
    color: #3d3d5c;
  }
  .app { width: 100vw; height: 100vh; position: relative; overflow: hidden; }

  /* ---------- 홈 화면 ---------- */
  .home {
    height: 100%; display: flex; flex-direction: column; padding: 24px 32px;
    background:
      radial-gradient(circle at 15% 20%, #FFE0EC 0%, transparent 40%),
      radial-gradient(circle at 85% 10%, #D4E9FA 0%, transparent 40%),
      radial-gradient(circle at 90% 90%, #FFF6D0 0%, transparent 40%),
      radial-gradient(circle at 10% 85%, #D4F5DA 0%, transparent 40%),
      linear-gradient(135deg, #FFFAF0 0%, #FFF5FA 100%);
  }
  .home-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .home-title {
    font-size: 44px; font-weight: 700;
    background: linear-gradient(90deg, #FF6B9D, #FFA94D, #FFD93D, #6BCF7F, #4DABF7, #9775FA);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0;
    letter-spacing: -1px;
  }
  .home-title::after {
    content: '✏️'; font-size: 36px; margin-left: 8px;
    -webkit-text-fill-color: initial;
  }
  .home-subtitle {
    background: white; padding: 12px 24px; border-radius: 999px;
    font-size: 22px; color: #6b6b8a;
    box-shadow: 0 4px 0 rgba(200, 180, 220, 0.3);
  }
  .stars-collected {
    background: linear-gradient(135deg, #FFD93D, #FFA94D); color: white;
    padding: 12px 20px; border-radius: 999px;
    font-size: 22px; font-weight: 700;
    box-shadow: 0 4px 0 #E89600, 0 6px 12px rgba(255, 169, 77, 0.4);
    display: flex; align-items: center; gap: 6px;
  }
  .number-grid {
    display: grid; grid-template-columns: repeat(7, 1fr); gap: 14px;
    flex: 1; align-content: center;
    /* 항목이 많은 탭은 그리드 안에서만 스크롤한다. min-height 를 풀지 않으면
       flex 항목이 콘텐츠 높이만큼 부풀어 화면 밖으로 밀려난다. */
    min-height: 0; overflow-y: auto;
  }
  .number-grid.scrolly { align-content: start; padding-right: 4px; }
  .number-card {
    background: white; border-radius: 24px; padding: 12px;
    font-family: inherit; color: inherit; text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
    box-shadow: 0 6px 0 rgba(0,0,0,0.08), 0 8px 20px rgba(0,0,0,0.06);
    transition: transform 0.15s, box-shadow 0.15s;
    aspect-ratio: 1;
    border: 4px solid transparent;
  }
  .number-card:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.08);
  }
  .number-card:focus-visible { outline: 4px solid #A9C7FF; outline-offset: 3px; }
  .btn:focus-visible, .btn-back:focus-visible, .demo-play-btn:focus-visible {
    outline: 4px solid #A9C7FF; outline-offset: 3px;
  }
  .number-card .num {
    font-size: 52px; font-weight: 700; line-height: 1;
    margin-bottom: 2px;
  }
  .number-card .ko {
    font-size: 15px; color: #8a8aa8;
  }
  .number-card .card-stars {
    position: absolute; top: 6px; right: 8px;
    font-size: 12px; display: flex; gap: 1px;
  }
  .number-card .card-stars .star { color: #FFD93D; }
  .number-card .card-stars .star.empty { color: #E5E5EA; }

  /* ---------- 카테고리 탭 ---------- */
  .category-tabs { display: flex; gap: 10px; margin-bottom: 16px; }
  .category-tab {
    flex: 1; height: 62px; border: none; border-radius: 20px; cursor: pointer;
    font-family: inherit; font-weight: 700; font-size: 22px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 5px 0 rgba(0,0,0,0.08);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .category-tab .tab-icon {
    width: 36px; height: 36px; border-radius: 12px; background: white;
    font-size: 16px; display: flex; align-items: center; justify-content: center;
  }
  .category-tab.on { transform: translateY(-2px); box-shadow: 0 6px 0 rgba(0,0,0,0.16); }
  .category-tab.on .tab-icon { background: rgba(255,255,255,0.9); }
  .category-tab:focus-visible { outline: 4px solid #A9C7FF; outline-offset: 3px; }

  /* 단어는 항목이 길어 카드를 넓게 눕힌다 */
  .number-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }
  .number-grid.wide-cards .number-card { aspect-ratio: auto; min-height: 92px; }
  .number-card .word-emoji { font-size: 26px; line-height: 1; margin-bottom: 2px; }
  .number-card .num.word-text { font-size: 30px; }

  /* 잠금 — 평평하게 가라앉히고 빨강·회색 경고 톤은 쓰지 않는다 */
  .number-card.locked {
    background: #F1ECE4; box-shadow: none; cursor: default; border-color: transparent;
  }
  .number-card.locked .num, .number-card.locked .word-emoji { opacity: 0.35; }
  .number-card.locked .ko { color: #b6a994; }
  .number-card.locked:active { transform: none; box-shadow: none; }
  .number-card .card-lock { position: absolute; bottom: 6px; right: 8px; font-size: 14px; opacity: 0.5; }
  @keyframes card-bounce {
    0%   { transform: translateY(0) scale(1); }
    35%  { transform: translateY(-8px) scale(1.03); }
    70%  { transform: translateY(0) scale(0.99); }
    100% { transform: translateY(0) scale(1); }
  }
  .number-card.bounce { animation: card-bounce 420ms ease-out; }

  /* ---------- 단어 넣기 (부모용) ---------- */
  .number-card.add-word { background: #F7F4FF; border: 3px dashed #cfc6e8; box-shadow: none; }
  .number-card .add-word-label { font-size: 15px; color: #8a8aa8; }
  .word-sheet {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; background: rgba(60,48,80,0.4);
  }
  .word-sheet.active { display: flex; }
  .sheet-card {
    width: min(560px, 92vw); max-height: 88vh; overflow: auto;
    background: white; border-radius: 28px; padding: 24px;
    box-shadow: 0 10px 0 rgba(0,0,0,0.10), 0 30px 60px rgba(0,0,0,0.22);
    display: flex; flex-direction: column; gap: 12px;
  }
  .sheet-card h2 { margin: 0; font-size: 26px; }
  .sheet-hint { margin: 0; font-size: 14px; font-weight: 500; color: #8a8aa8; line-height: 1.6; }
  .sheet-row { display: flex; gap: 10px; }
  .sheet-row input {
    flex: 1; height: 52px; border-radius: 16px; border: 3px solid #e5e0f0;
    padding: 0 16px; font-family: inherit; font-size: 22px; color: inherit;
  }
  .sheet-row input:focus-visible { outline: 4px solid #A9C7FF; outline-offset: 2px; }
  .sheet-emojis { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet-emoji {
    width: 46px; height: 46px; border-radius: 14px; font-size: 22px; cursor: pointer;
    border: 3px solid transparent; background: #f4f2fa;
  }
  .sheet-emoji.on { border-color: #9775FA; background: #ece5ff; }
  .sheet-msg { min-height: 20px; font-size: 14px; font-weight: 500; color: #d2544f; }
  .sheet-list { display: flex; flex-direction: column; gap: 6px; }
  .sheet-item {
    display: flex; align-items: center; justify-content: space-between;
    background: #f7f6fb; border-radius: 14px; padding: 8px 14px; font-size: 20px;
  }
  .sheet-del {
    border: none; background: transparent; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 700; color: #8a8aa8;
  }
  .sheet-empty { font-size: 14px; font-weight: 500; color: #b8b8d0; padding: 4px 2px; }

  /* ---------- 연습 화면 ---------- */
  .practice {
    height: 100%; display: none; flex-direction: column;
    padding: 16px 24px;
  }
  .practice.active { display: flex; }
  .practice-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
  }
  .btn-back {
    background: white; border: none; border-radius: 999px;
    padding: 10px 20px; font-size: 22px; cursor: pointer;
    font-family: inherit; font-weight: 700; color: #6b6b8a;
    box-shadow: 0 4px 0 rgba(0,0,0,0.08);
    display: flex; align-items: center; gap: 6px;
  }
  .btn-back:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.08); }
  .step-indicator {
    display: flex; gap: 8px; flex: 1; justify-content: center;
  }
  .step-dot {
    background: white; border-radius: 999px;
    padding: 10px 20px; font-size: 20px; font-weight: 700;
    color: #b8b8d0; display: flex; align-items: center; gap: 8px;
    box-shadow: 0 3px 0 rgba(0,0,0,0.06);
  }
  .step-dot.active {
    background: linear-gradient(135deg, #FFA94D, #FF6B9D);
    color: white;
    box-shadow: 0 3px 0 #C55C7A;
  }
  .step-dot.done {
    background: #6BCF7F; color: white;
    box-shadow: 0 3px 0 #4CAF60;
  }
  .step-dot .step-num {
    background: rgba(255,255,255,0.4); border-radius: 999px;
    width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .step-dot.active .step-num, .step-dot.done .step-num {
    background: rgba(255,255,255,0.35);
  }

  .practice-body {
    flex: 1; display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px;
    min-height: 0;
  }

  /* 왼쪽: 정보 패널 */
  .info-panel {
    background: white; border-radius: 32px; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2px;
    box-shadow: 0 8px 0 rgba(0,0,0,0.06);
    overflow: hidden;
  }
  /* 눌러서 소리로 들을 수 있는 요소 */
  .speakable {
    border: none; background: transparent; font-family: inherit; color: inherit;
    cursor: pointer; padding: 2px 10px; border-radius: 16px;
    position: relative; transition: background 0.15s, transform 0.1s;
  }
  .speakable:hover { background: #F4F4FB; }
  .speakable:active { transform: scale(0.96); background: #ECECF8; }
  .speakable:focus-visible { outline: 4px solid #A9C7FF; outline-offset: 2px; }
  .speakable.speaking { background: #FFF3C4; }
  .info-objects .obj-caption {
    width: 100%; text-align: center; margin-top: 6px;
    font-size: 21px; color: #6b6b8a;
  }
  .info-num {
    font-size: 150px; font-weight: 700; line-height: 0.9;
    margin: 0;
  }
  /* '강아지' 같은 여러 글자는 한 칸에 다 들어가지 않는다 */
  .info-num.compact { font-size: 76px; line-height: 1.1; }
  .info-names {
    display: flex; align-items: baseline; gap: 10px;
    margin: 2px 0 6px;
  }
  .info-ko { font-size: 40px; color: #6b6b8a; }
  .info-native {
    font-size: 30px; color: #7a7a9c;
  }
  .info-native::before {
    content: '·'; margin-right: 10px; color: #d0d0e0;
  }
  .info-en {
    font-size: 18px; color: #b8b8d0; letter-spacing: 1px;
    margin-bottom: 10px; text-transform: uppercase;
  }
  /* 노란 상자는 내용 높이에만 맞춘다 (예전엔 flex:1로 패널을 다 먹었다) */
  .info-objects {
    background: #FFF9DC; border-radius: 20px; padding: 12px 14px;
    width: 100%; flex: 0 0 auto; max-height: 100%;
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 4px; overflow: hidden;
    align-content: center;
  }
  .info-objects .emoji {
    font-size: 34px;
    animation: bounce-in 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) both;
  }
  .info-objects.zero {
    color: #b8b8d0; font-size: 20px;
  }
  @keyframes bounce-in {
    0% { transform: scale(0) rotate(-180deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* 오른쪽: 그리기 영역 */
  .canvas-panel {
    background: white; border-radius: 32px; padding: 20px;
    display: flex; flex-direction: column;
    box-shadow: 0 8px 0 rgba(0,0,0,0.06);
    position: relative;
    min-height: 0;
  }
  .canvas-title {
    font-size: 24px; text-align: center;
    color: #6b6b8a; margin: 0 0 8px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .canvas-wrapper {
    flex: 1; position: relative;
    background: linear-gradient(180deg, #FAFAFF 0%, #F0F4FF 100%);
    border-radius: 20px;
    border: 4px dashed #D4D4E5;
    overflow: hidden;
    min-height: 0;
  }
  .canvas-wrapper svg, .canvas-wrapper canvas {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }
  /* "다시 보기" 버튼이 떠 있는 1단계에서는 글자가 버튼에 가리지 않도록
     캔버스 아래쪽을 버튼 높이만큼 비운다. */
  .canvas-wrapper.with-replay svg { height: calc(100% - 68px); }
  .canvas-wrapper canvas {
    touch-action: none;
    z-index: 2;
  }
  .guide-svg { z-index: 1; transition: opacity 0.25s ease; }
  /* 데모는 가이드를 파괴하지 않고 별도 오버레이 레이어에서 재생한다 */
  .demo-svg {
    z-index: 3; pointer-events: none;
  }
  .guide-svg.dimmed { opacity: 0.18; }

  /* 가이드 스타일 — 따라쓰기 가이드는 세 겹으로 분리한다.
     ① 넓고 연한 띠(어디를 지날지)  ② 그 위 가는 점선(중심선)  ③ 방향 화살표 */
  .stroke-outline {
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .guide-band { opacity: 0.15; }
  .guide-dots {
    stroke-linecap: round;
    opacity: 0.55;   /* dasharray는 화살표 위치와 맞물려야 해서 JS에서 설정 */
  }
  .stroke-faint {
    opacity: 0.15;
  }
  .start-dot {
    animation: pulse-dot 1.4s ease-in-out infinite;
    transform-origin: center;
    transform-box: fill-box;
  }
  @keyframes pulse-dot {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }
  .arrow-head {
    animation: pulse-arrow 1.4s ease-in-out infinite;
  }
  @keyframes pulse-arrow {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 0.4; }
  }
  .stroke-animate {
    stroke-dasharray: var(--len);
    stroke-dashoffset: var(--len);
    animation: draw-stroke var(--dur, 1.6s) ease-in-out forwards;
    animation-delay: var(--delay, 0s);
  }
  @keyframes draw-stroke {
    to { stroke-dashoffset: 0; }
  }

  /* 하단 버튼 바 */
  .action-bar {
    display: flex; gap: 12px; margin-top: 12px; justify-content: center;
  }
  .btn {
    background: white; border: none; border-radius: 999px;
    padding: 12px 24px; font-size: 22px; cursor: pointer;
    font-family: inherit; font-weight: 700; color: #6b6b8a;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    display: flex; align-items: center; gap: 8px;
    transition: transform 0.1s;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.1); }
  .btn-primary {
    background: linear-gradient(135deg, #FF6B9D, #FFA94D); color: white;
    box-shadow: 0 4px 0 #C55C7A;
  }
  .btn-primary:active { box-shadow: 0 2px 0 #C55C7A; }
  .btn-success {
    background: linear-gradient(135deg, #6BCF7F, #4DABF7); color: white;
    box-shadow: 0 4px 0 #4CAF60;
  }
  .btn-success:active { box-shadow: 0 2px 0 #4CAF60; }
  /* 아이콘 버튼: 4세 손가락 기준 최소 터치 타깃 60x60, 라벨 병기 */
  .btn-icon {
    flex-direction: column; justify-content: center;
    min-width: 72px; min-height: 60px;
    padding: 8px 14px; gap: 1px;
  }
  .btn-icon .ico { font-size: 25px; line-height: 1.1; }
  .btn-icon .lbl { font-size: 14px; font-weight: 700; letter-spacing: -0.3px; }
  .btn { min-height: 60px; }

  /* ---------- 완료 축하 오버레이 ---------- */
  .celebration {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center;
    background: rgba(0,0,0,0.4); z-index: 100;
    backdrop-filter: blur(6px);
  }
  .celebration.active { display: flex; }
  .celebration-card {
    background: white; border-radius: 40px; padding: 40px 60px;
    text-align: center; position: relative;
    animation: pop-in 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) both;
    box-shadow: 0 12px 0 rgba(0,0,0,0.15);
  }
  @keyframes pop-in {
    0% { transform: scale(0) rotate(-10deg); }
    100% { transform: scale(1) rotate(0); }
  }
  .celebration-emoji { font-size: 100px; margin-bottom: 8px; animation: wobble 1s ease-in-out infinite; }
  @keyframes wobble {
    0%, 100% { transform: rotate(-8deg); }
    50% { transform: rotate(8deg); }
  }
  .celebration-title {
    font-size: 48px; font-weight: 700;
    background: linear-gradient(90deg, #FF6B9D, #FFA94D, #FFD93D);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    margin: 0 0 8px;
  }
  .celebration-sub { font-size: 26px; color: #8a8aa8; margin: 0 0 20px; }
  .celebration-stars { font-size: 60px; margin: 12px 0 20px; letter-spacing: 8px; }
  .celebration-stars .star { display: inline-block; opacity: 0; }
  .celebration-stars .star.show { animation: star-pop 0.5s cubic-bezier(0.68, -0.55, 0.27, 1.55) forwards; }
  @keyframes star-pop {
    0% { opacity: 0; transform: scale(0) rotate(-360deg); }
    100% { opacity: 1; transform: scale(1) rotate(0); }
  }
  .celebration-actions { display: flex; gap: 12px; justify-content: center; }

  /* 떠다니는 축하 이모지 */
  .confetti {
    position: absolute; font-size: 32px;
    pointer-events: none;
    animation: confetti-fall 2s ease-out forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0); opacity: 1; }
    100% { transform: translateY(120vh) rotate(720deg); opacity: 0; }
  }

  /* "다시 보기" 버튼 - 글자를 가리지 않도록 캔버스 하단 중앙 */
  .demo-play-btn {
    position: absolute; bottom: 14px; left: 50%;
    min-height: 60px;
    transform: translateX(-50%);
    z-index: 5;
    background: white; border: none;
    padding: 14px 26px;
    border-radius: 999px;
    font-family: inherit;
    font-size: 22px; font-weight: 700;
    box-shadow: 0 5px 0 rgba(0,0,0,0.1);
    display: flex; align-items: center; gap: 10px;
    color: #6b6b8a; cursor: pointer;
    animation: gentle-pulse 2s ease-in-out infinite;
  }
  @keyframes gentle-pulse {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.05); }
  }
  .demo-play-btn.hidden { display: none; }
  .demo-play-btn:active {
    transform: translateX(-50%) translateY(3px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.1);
    animation: none;
  }
  .demo-play-btn[disabled] { opacity: 0.45; animation: none; }

  /* 격려 뱃지 (그리는 도중 표시) */
  .encourage-badge {
    position: absolute; top: 12px; right: 12px;
    background: linear-gradient(135deg, #6BCF7F, #4DABF7); color: white;
    padding: 8px 16px; border-radius: 999px;
    font-size: 20px; font-weight: 700;
    box-shadow: 0 4px 0 rgba(0,0,0,0.1);
    z-index: 4;
    animation: badge-in 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55) both;
  }
  @keyframes badge-in {
    0% { transform: translateX(80px); opacity: 0; }
    100% { transform: translateX(0); opacity: 1; }
  }

  /* 움직임 줄이기 설정 존중.
     획순 데모(획이 그려지는 애니메이션)는 학습의 핵심이라 유지하고,
     장식용 반복 애니메이션과 컨페티만 끈다. */
  @media (prefers-reduced-motion: reduce) {
    .start-dot, .arrow-head, .demo-play-btn, .celebration-emoji {
      animation: none !important;
    }
    .info-objects .emoji, .celebration-card, .celebration-stars .star.show,
    .encourage-badge {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
    .confetti { display: none; }
    .number-card, .btn, .speakable { transition: none; }
  }

  /* 반응형: 작은 태블릿 세로 */
  @media (max-aspect-ratio: 1/1) {
    .number-grid { grid-template-columns: repeat(5, 1fr); }
    .practice-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .info-num { font-size: 92px; }
    .info-ko { font-size: 30px; }
    .info-native { font-size: 24px; }
  }

  /* ---------- 좁은 화면 (폰) ----------
     헤더의 세 덩어리가 flex 안에서 눌리면 글자가 한 줄에 하나씩 세로로
     쌓인다. 320px 폭에서는 제목만으로 화면의 79%를 먹고 카드가 아래로
     밀려 나가 아무것도 고를 수 없었다. 폭 기준으로 줄이고 줄바꿈을 막는다. */
  @media (max-width: 820px) {
    .home { padding: 14px 16px; }
    .home-header { gap: 10px; margin-bottom: 12px; }
    .home-title {
      font-size: 26px; letter-spacing: -0.5px;
      white-space: nowrap; flex: 0 1 auto; min-width: 0;
    }
    .home-title::after { font-size: 22px; margin-left: 4px; }
    .home-subtitle { display: none; }
    .stars-collected {
      padding: 8px 14px; font-size: 18px; white-space: nowrap; flex: none;
    }
    .category-tabs { gap: 6px; margin-bottom: 10px; }
    .category-tab {
      height: 48px; font-size: 15px; gap: 5px; border-radius: 14px;
      white-space: nowrap; min-width: 0; padding: 0 6px;
    }
    .category-tab .tab-icon { font-size: 13px; padding: 3px 5px; }
    /* align-content:center 는 넘칠 때 위아래로 균등하게 넘겨 첫 줄이
       탭 뒤로 잘린다. 좁은 화면에서는 위에서부터 채우고 스크롤한다. */
    .number-grid { gap: 8px; align-content: start; }
    .number-card { padding: 6px; border-width: 3px; }
    .number-card .num { font-size: 30px; }
    .number-card .ko { font-size: 11px; }
    .number-card .card-stars { top: 3px; right: 4px; font-size: 9px; }
  }

  /* 아주 좁은 폰 — 제목을 더 줄이고, 탭은 아이콘을 빼 라벨만 남긴다.
     탭 5개를 320px 에 나누면 하나당 58px 뿐이라 아이콘까지 넣으면 겹친다. */
  @media (max-width: 500px) {
    .home-title { font-size: 21px; }
    .home-title::after { content: none; }
    .category-tab { font-size: 14px; height: 44px; gap: 0; padding: 0 4px; }
    .category-tab .tab-icon { display: none; }
    .number-grid { grid-template-columns: repeat(4, 1fr); }
  }

  /* 세로가 짧은 가로 화면(폰 가로) — 정사각 카드가 너무 커서 3행이 안 들어간다 */
  @media (max-height: 520px) {
    .number-grid { align-content: start; }
    .number-card { aspect-ratio: auto; min-height: 62px; }
    .number-card .num { font-size: 26px; }
  }

  /* ---------- 좁은 화면의 연습 화면 ----------
     세로에서는 정보 패널이 auto 행이라 제 콘텐츠만큼 부풀고, 캔버스(1fr)가
     8px 까지 눌리면서 CTA 버튼이 화면 밖으로 밀려났다. 스크롤이 없으니
     아이는 글자를 볼 수도, 다음으로 넘어갈 수도 없었다.
     정보 패널을 가로 띠로 눕혀 높이를 고정하고 나머지를 캔버스에 준다. */
  @media (max-width: 820px), (max-height: 520px) {
    .practice { padding: 10px 12px; }
    .practice-header { gap: 8px; margin-bottom: 6px; }
    .btn-back { padding: 8px 12px; font-size: 15px; min-height: 44px; }
    .practice-header > div[style] { display: none; }   /* 우측 균형용 빈 칸 */
    .step-indicator { gap: 5px; }
    .step-dot { padding: 6px 10px; font-size: 13px; gap: 5px; white-space: nowrap; }
    .step-dot .step-num { width: 18px; height: 18px; font-size: 12px; }

    .practice-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; gap: 10px; }

    /* 정보 패널 — 세로 스택을 가로 한 줄로 */
    .info-panel {
      flex-direction: row; align-items: center; justify-content: flex-start;
      gap: 12px; padding: 10px 14px; border-radius: 22px;
      box-shadow: 0 5px 0 rgba(0,0,0,0.06);
    }
    .info-num { font-size: 46px; padding: 0 6px; flex: none; }
    .info-names { flex-direction: column; align-items: flex-start; gap: 0; margin: 0; flex: none; }
    .info-ko { font-size: 20px; padding: 0 4px; }
    .info-native { font-size: 15px; padding: 0 4px; }
    .info-native::before { content: none; }
    .info-en { display: none; }
    .info-objects {
      flex: 1; min-width: 0; padding: 6px 8px; border-radius: 14px; gap: 2px;
      max-height: 72px; overflow: hidden;
    }
    .info-objects .emoji { font-size: 18px; }
    .info-objects .obj-caption { font-size: 13px; margin-top: 2px; }

    .canvas-panel { padding: 10px; border-radius: 22px; }
    .canvas-title { font-size: 15px; margin-bottom: 5px; }
    .canvas-wrapper { min-height: 150px; border-width: 3px; border-radius: 14px; }
    .action-bar { gap: 6px; margin-top: 8px; }
    .btn { padding: 8px 12px; font-size: 15px; min-height: 52px; }
    .btn-icon { min-width: 54px; min-height: 52px; padding: 5px 8px; }
    .btn-icon .ico { font-size: 19px; }
    .btn-icon .lbl { font-size: 11px; }
    .demo-play-btn { bottom: 8px; padding: 8px 14px; font-size: 15px; min-height: 44px; }
    .canvas-wrapper.with-replay svg { height: calc(100% - 50px); }

    /* 좁은 폭에서 flex 로 눌리면 "처/음/으/로" 처럼 한 글자씩 쌓인다 */
    .btn-back, .step-dot, .btn, .btn-icon .lbl, .canvas-title { white-space: nowrap; }
    .btn-back { flex: none; }
    .step-indicator { flex: 1; min-width: 0; justify-content: flex-start; }
  }

  /* 아주 좁은 폰 — 뒤로 버튼은 화살표만, 단계 칩은 더 촘촘히 */
  @media (max-width: 500px) {
    .btn-back { font-size: 0; padding: 8px 12px; min-height: 44px; }
    .btn-back::before { content: '←'; font-size: 20px; }
    .step-dot { padding: 5px 8px; font-size: 12px; gap: 4px; }
    .step-dot .step-num { width: 17px; height: 17px; font-size: 11px; }
    .btn-icon .lbl { font-size: 10px; }
    .btn-primary, .btn-success { font-size: 13px; padding: 6px 10px; }
  }

  /* 폰 가로 — 세로가 342px 밖에 안 돼 한 줄이라도 더 짜내야 CTA 가 들어온다 */
  @media (max-height: 460px) {
    .practice { padding: 6px 10px; }
    .practice-header { margin-bottom: 4px; }
    .btn-back { min-height: 40px; padding: 6px 10px; font-size: 14px; }
    .step-dot { padding: 5px 8px; font-size: 12px; }
    .practice-body { gap: 6px; }
    .info-panel { padding: 6px 10px; gap: 8px; border-radius: 16px; }
    .info-num { font-size: 32px; }
    .info-ko { font-size: 16px; }
    .info-native { font-size: 13px; }
    .info-objects { max-height: 46px; }
    .info-objects .emoji { font-size: 14px; }
    .canvas-panel { padding: 6px; border-radius: 16px; }
    .canvas-title { display: none; }
    .canvas-wrapper { min-height: 96px; }
    .action-bar { margin-top: 5px; gap: 5px; }
    .btn { min-height: 44px; padding: 5px 10px; font-size: 14px; }
    .btn-icon { min-width: 46px; min-height: 44px; padding: 3px 6px; }
    .btn-icon .ico { font-size: 16px; }
    .btn-icon .lbl { font-size: 10px; }
    .demo-play-btn { min-height: 38px; bottom: 5px; padding: 6px 12px; font-size: 13px; }
    .canvas-wrapper.with-replay svg { height: calc(100% - 42px); }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- 홈 화면 -->
  <div class="home" id="home">
    <div class="home-header">
      <h1 class="home-title">한글·숫자 쓰기 연습</h1>
      <div class="home-subtitle" id="homeSubtitle">숫자를 골라볼까요?</div>
      <div class="stars-collected" id="totalStars">⭐ <span id="totalStarsNum">0</span></div>
    </div>
    <div class="category-tabs" id="categoryTabs" role="group" aria-label="배울 것 고르기"></div>
    <div class="number-grid" id="numberGrid" role="list" aria-label="연습할 숫자 고르기"></div>
  </div>

  <!-- 단어 넣기 (부모용) -->
  <div class="word-sheet" id="wordSheet"></div>

  <!-- 연습 화면 -->
  <div class="practice" id="practice">
    <div class="practice-header">
      <button type="button" class="btn-back" onclick="goHome()" aria-label="처음 화면으로 돌아가기">← 처음으로</button>
      <div class="step-indicator" id="stepIndicator">
        <div class="step-dot" data-step="0"><span class="step-num">1</span><span>보기</span></div>
        <div class="step-dot" data-step="1"><span class="step-num">2</span><span>따라쓰기</span></div>
        <div class="step-dot" data-step="2"><span class="step-num">3</span><span>혼자쓰기</span></div>
      </div>
      <div style="width: 130px"></div>
    </div>

    <div class="practice-body">
      <div class="info-panel" id="infoPanel">
        <button type="button" class="info-num speakable" id="infoNum">0</button>
        <div class="info-names">
          <button type="button" class="info-ko speakable" id="infoKo">영</button>
          <button type="button" class="info-native speakable" id="infoNative">하나</button>
        </div>
        <div class="info-en" id="infoEn">zero</div>
        <div class="info-objects" id="infoObjects"></div>
      </div>

      <div class="canvas-panel">
        <div class="canvas-title" id="canvasTitle">👀 숫자 모양을 잘 보세요</div>
        <div class="canvas-wrapper" id="canvasWrapper">
          <svg class="guide-svg" id="guideSvg" preserveAspectRatio="xMidYMid meet"></svg>
          <canvas id="drawCanvas"></canvas>
          <svg class="demo-svg" id="demoSvg" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
          <button type="button" class="demo-play-btn" id="demoBtn" onclick="playStrokeDemo()"
                  aria-label="쓰는 순서 다시 보기">
            🎬 <span>다시 보기</span>
          </button>
        </div>
        <div class="action-bar" id="actionBar"></div>
      </div>
    </div>
  </div>

  <!-- 완료 축하 -->
  <div class="celebration" id="celebration">
    <div class="celebration-card">
      <div class="celebration-emoji" id="celebEmoji">🎉</div>
      <h2 class="celebration-title" id="celebTitle">참 잘했어요!</h2>
      <p class="celebration-sub" id="celebSub">숫자를 완성했어요</p>
      <div class="celebration-stars" id="celebStars">
        <span class="star">⭐</span><span class="star">⭐</span><span class="star">⭐</span>
      </div>
      <div class="celebration-actions">
        <button class="btn" onclick="closeCelebration()">👍 좋아요</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextNumber()">다음 숫자 →</button>
      </div>
    </div>
  </div>
</div>

<script src="number-data.js"></script>
<script src="hangul-data.js"></script>
<script src="custom-words.js"></script>
<script src="app.js"></script>
</body>
</html>
