# 정적 웹앱을 GitHub Pages로 배포한다. 빌드 도구가 없으므로 저장소를 그대로 올린다.
#
# 최초 1회 저장소 Settings > Pages > Source 를 "GitHub Actions"로 바꿔야 한다.
# 아래 enablement: true 는 액션이 Pages 를 대신 켜 보게 하지만, 워크플로의
# GITHUB_TOKEN 에는 Pages 생성 권한이 없어("Resource not accessible by
# integration") 실제로는 사람이 한 번 켜 줘야 한다. 켠 뒤로는 무시되는 값이므로
# 권한이 있는 환경에서 그대로 동작하도록 남겨 둔다.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치지 않게 한 번에 하나씩. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
