# 정적 웹앱을 GitHub Pages로 배포한다. 빌드 도구가 없으므로 저장소를 그대로 올린다.
# configure-pages 의 enablement: true 가 Pages 자체를 켜 주므로 저장소 설정을
# 손댈 필요가 없다. 이 값이 기본값(false)이면 Pages 가 꺼진 저장소에서
# "Get Pages site failed ... Not Found" 로 죽는다.
name: Deploy to GitHub Pages

on:
  push:
    # 기본 브랜치. main으로 이름을 바꿔도 계속 동작하도록 둘 다 적어 둔다.
    branches:
      - claude/writing-practice-app-v2-8y6ubg
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 겹치지 않게 한 번에 하나씩. 진행 중인 배포를 취소하지는 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
